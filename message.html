<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .menu-page {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .menu-item {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-item:hover {
            transform: translateX(5px);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .menu-item .icon {
            font-size: 24px;
            width: 40px;
            text-align: center;
        }

        .menu-item .text {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }

        .notification-badge {
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-left: auto;
        }

        /* Page Envoyer Message */
        .message-page {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #5568d3;
        }

        .message-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .message-header .icon {
            font-size: 64px;
            margin-bottom: 10px;
        }

        .message-header h2 {
            color: #333;
            font-size: 28px;
        }

        .message-header p {
            color: #666;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .image-preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            border-radius: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .notifications-page {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .notifications-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .notifications-header h2 {
            color: #333;
            font-size: 28px;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .notification-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .notification-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .notification-item p {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .notification-item .date {
            color: #999;
            font-size: 14px;
        }

        .notification-item img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Menu Principal -->
        <div id="menuPage" class="page active">

                <div class="menu-items">
                    <div class="menu-item" onclick="showPage('annoncesPage')">
                        <span class="icon">💬</span>
                        <span class="text">Messages</span>
                        <span class="notification-badge" id="notifBadge" style="display: none;">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Choix Annonces -->
        <div id="annoncesPage" class="page">
            <div class="menu-page">
                <button class="back-btn" onclick="showPage('menuPage')">← Retour</button>
                
                <div class="header">
                    <h1>💬 Messages</h1>
                    <p style="color: #666; margin-top: 10px;">Choisissez une option</p>
                </div>

                <div class="menu-items">
                    <div class="menu-item" onclick="showPage('messagePage')">
                        <span class="icon">✉️</span>
                        <span class="text">Envoyer un message</span>
                    </div>

                    <div class="menu-item" onclick="showPage('messagesRecusPage')">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span class="text">Messages reçus</span>
                        <span class="notification-badge" id="notifBadge2" style="display: none;">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Envoyer Message -->
        <div id="messagePage" class="page">
            <div class="message-page">
                <button class="back-btn" onclick="showPage('annoncesPage')">← Retour</button>
                
                <div id="successMessage" class="success-message">
                    ✓ Votre annonce a été envoyée avec succès !
                </div>

                <div class="message-header">
                    <i class="fa-thin fa-message"></i>
                    <h2>Envoyer un Message</h2>
                    <p>Contacter l'administration</p>
                </div>

                <form id="messageForm">
                    <div class="form-group">
                        <label for="subject">Objet </label>
                        <input type="text" id="subject" name="subject" required placeholder="Entrez l'objet du message">
                    </div>

                    <div class="form-group">
                        <label for="description">Description </label>
                        <textarea id="description" name="description" required placeholder="Décrivez votre message en détail"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Photo </label>
                        <div class="file-input-wrapper">
                            <input type="file" id="photo" name="photo" accept="image/*" onchange="previewImage(event)">
                            <label for="photo" class="file-input-label">
                                <i class="fa-light fa-camera"></i>
                                <span>Ajouter une photo</span>
                            </label>
                        </div>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>

                    <button type="submit" class="submit-btn">Envoyer le message</button>
                </form>
            </div>
        </div>

        <!-- Page Messages Reçus -->
        <div id="messagesRecusPage" class="page">
            <div class="notifications-page">
                <button class="back-btn" onclick="showPage('annoncesPage')">← Retour</button>

                <div class="notifications-header">
                    <h2><i class="fa-solid fa-comment-dots"></i> Messages Reçus</h2>
                </div>

                <div id="messagesRecusList" class="notifications-list">
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Aucun message reçu</h3>
                        <p>Vous n'avez reçu aucun message pour le moment</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notifications = [];

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function previewImage(e) {
            const preview = document.getElementById('imagePreview');
            const file = e.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.innerHTML = `<img src="${event.target.result}" alt="Aperçu">`;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notifBadge');
            if (notifications.length > 0) {
                badge.textContent = notifications.length;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function displayNotifications() {
            const list = document.getElementById('notificationsList');
            
            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Aucune notification</h3>
                        <p>Vous n'avez reçu aucun message pour le moment</p>
                    </div>
                `;
            } else {
                list.innerHTML = notifications.map(notif => `
                    <div class="notification-item">
                        <h3>${notif.subject}</h3>
                        <p>${notif.description}</p>
                        ${notif.image ? `<img src="${notif.image}" alt="Image jointe">` : ''}
                        <div class="date">${notif.date}</div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const subject = document.getElementById('subject').value;
            const description = document.getElementById('description').value;
            const photoInput = document.getElementById('photo');
            const preview = document.getElementById('imagePreview');
            
            const notification = {
                subject: subject,
                description: description,
                image: preview.querySelector('img') ? preview.querySelector('img').src : null,
                date: new Date().toLocaleString('fr-FR')
            };
            
            notifications.unshift(notification);
            
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            
            this.reset();
            preview.style.display = 'none';
            preview.innerHTML = '';
            
            updateNotificationBadge();
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        });

        document.getElementById('notificationsPage').addEventListener('click', function() {
            displayNotifications();
        });
    </script>
</body>
</html>
